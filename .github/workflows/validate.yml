name: validate-skill

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Skill package
        run: python scripts/validate_skill.py
      - name: Run skill contract tests
        run: python -m unittest -v tests.test_skill_contract
